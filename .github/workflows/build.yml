name: Build Releases

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libgl1
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Read app version
        id: version
        shell: pwsh
        run: |
          $ver = python -c "import sys; sys.path.insert(0, 'src'); from version import APP_VERSION; print(APP_VERSION)"
          echo "APP_VERSION=$ver" >> $env:GITHUB_OUTPUT
      - name: Install NSIS
        run: choco install nsis -y
      - name: Build portable + installer
        shell: pwsh
        run: |
          & scripts/build_windows.ps1 -Arch x64
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BiliHistory-windows-x64
          path: |
            dist/BiliHistory-x64.exe
            dist/BiliHistory-${{ steps.version.outputs.APP_VERSION }}-x64-setup.exe

  build-linux:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            image: ''
            platform: ''
          - arch: arm64
            runner: ubuntu-latest
            image: arm64v8/python:3.12-bookworm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install fpm (native)
        if: matrix.platform == ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential
          sudo gem install --no-document fpm
      - name: Set up QEMU
        if: matrix.platform != ''
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ matrix.platform }}
      - name: Build native ${{ matrix.arch }}
        if: matrix.platform == ''
        env:
          ARCH: ${{ matrix.arch }}
        run: bash scripts/build_linux.sh
      - name: Build in container ${{ matrix.arch }}
        if: matrix.platform != ''
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          docker run --rm \
            --platform ${{ matrix.platform }} \
            -v "$(pwd):/workspace" \
            -w /workspace \
            -e ARCH=${{ matrix.arch }} \
            ${{ matrix.image }} \
            bash -c "
              apt-get update && \
              apt-get install -y dpkg-dev libfuse2 ruby ruby-dev build-essential && \
              gem install --no-document fpm && \
              bash scripts/build_linux.sh
            "
      - name: Read app version
        id: version
        run: |
          ver=$(python3 -c "import sys; sys.path.insert(0, 'src'); from version import APP_VERSION; print(APP_VERSION)")
          echo "APP_VERSION=$ver" >> "$GITHUB_OUTPUT"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BiliHistory-linux-${{ matrix.arch }}
          path: |
            dist/BiliHistory-${{ matrix.arch }}
            dist/BiliHistory-${{ matrix.arch }}.*
            dist/bilihistory_${{ steps.version.outputs.APP_VERSION }}_*.deb
            dist/bilihistory-${{ steps.version.outputs.APP_VERSION }}-*.rpm
            dist/bilihistory-${{ steps.version.outputs.APP_VERSION }}-*.pkg.tar.zst
            dist/bilihistory-${{ steps.version.outputs.APP_VERSION }}.ebuild

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Read app version
        id: version
        run: |
          ver=$(python3 -c "import sys; sys.path.insert(0, 'src'); from version import APP_VERSION; print(APP_VERSION)")
          echo "APP_VERSION=$ver" >> "$GITHUB_OUTPUT"
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: BiliHistory-*
          merge-multiple: true
      - name: List release artifacts
        run: find artifacts -type f -ls
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
